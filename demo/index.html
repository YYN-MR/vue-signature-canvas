<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vue-signature-canvas demo</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0b0d12;
        color: #e8eaf1;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial,
          sans-serif;
      }

      .page {
        min-height: 100%;
        display: flex;
        flex-direction: column;
      }

      .header {
        padding: 16px 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .title {
        font-size: 14px;
        letter-spacing: 0.3px;
        opacity: 0.9;
      }

      .actions {
        display: flex;
        gap: 10px;
      }

      .btn {
        height: 34px;
        padding: 0 12px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.06);
        color: #e8eaf1;
        cursor: pointer;
      }

      .btn.primary {
        background: rgba(10, 132, 255, 0.22);
        border-color: rgba(10, 132, 255, 0.35);
      }

      .content {
        padding: 18px;
        display: grid;
        grid-template-columns: 1.6fr 1fr;
        gap: 14px;
        flex: 1;
        min-height: 0;
      }

      .canvasWrap {
        min-height: 420px;
        background: radial-gradient(
            1200px 600px at 20% 10%,
            rgba(10, 132, 255, 0.18),
            transparent 40%
          ),
          rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 14px;
        padding: 12px;
      }

      .canvasEl {
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 12px;
      }

      .panel {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 14px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        overflow: auto;
        min-height: 0;
      }

      .row {
        display: grid;
        grid-template-columns: 120px 1fr;
        gap: 10px;
        align-items: center;
      }

      .label {
        font-size: 12px;
        opacity: 0.8;
      }

      .input {
        height: 34px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(0, 0, 0, 0.25);
        color: #e8eaf1;
        padding: 0 10px;
      }

      .check {
        width: 18px;
        height: 18px;
        accent-color: #0a84ff;
      }

      .textarea {
        width: 100%;
        height: 180px;
        resize: none;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(0, 0, 0, 0.25);
        color: #e8eaf1;
        padding: 10px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          'Liberation Mono', 'Courier New', monospace;
        font-size: 12px;
        line-height: 1.4;
      }

      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          'Liberation Mono', 'Courier New', monospace;
        font-size: 12px;
        opacity: 0.9;
        word-break: break-all;
      }

      @media (max-width: 980px) {
        .content {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://unpkg.com/signature_pad@3.0.0-beta.3/dist/signature_pad.umd.min.js"></script>
    <script src="https://unpkg.com/trim-canvas@0.1.2/build/index.js"></script>
    <script src="../dist/vue-signature-canvas.js"></script>
    <script>
      const { createApp, ref, computed } = Vue;

      createApp({
        setup() {
          const sigRef = ref(null);

          const penColor = ref('#0a84ff');
          const minWidth = ref(0.5);
          const maxWidth = ref(2.5);
          const throttle = ref(16);
          const enabled = ref(true);
          const lastEvent = ref('ready');
          const exportedDataUrl = ref('');

          const gridEnabled = ref(true);
          const gridMode = ref('zheng');
          const gridSize = ref(24);
          const gridColor = ref('rgba(255, 255, 255, 0.15)');
          const gridDash = ref('4,4');
          const gridLineWidth = ref(1);

          const guideEnabled = ref(true);
          const guideText = ref('张三');
          const guideFont = ref('');
          const guideColor = ref('#ff4d4f');
          const guideOpacity = ref(0.35);
          const guideDash = ref('6,6');
          const guideLineWidth = ref(2);

          const parseDash = (value) => {
            if (value == null || String(value).trim() === '') {
              return [];
            }

            const parts = String(value)
              .split(',')
              .map((v) => Number(v.trim()))
              .filter((n) => Number.isFinite(n) && n >= 0);

            return parts;
          };

          const options = computed(() => {
            return {
              penColor: penColor.value,
              minWidth: minWidth.value,
              maxWidth: maxWidth.value,
              throttle: throttle.value,
            };
          });

          const grid = computed(() => {
            if (!gridEnabled.value) {
              return false;
            }

            return {
              mode: gridMode.value,
              size: gridSize.value,
              color: gridColor.value,
              dash: parseDash(gridDash.value),
              lineWidth: gridLineWidth.value,
            };
          });

          const guide = computed(() => {
            if (!guideEnabled.value) {
              return null;
            }

            return {
              text: guideText.value,
              ...(String(guideFont.value || '').trim()
                ? { font: guideFont.value }
                : {}),
              color: guideColor.value,
              opacity: guideOpacity.value,
              dash: parseDash(guideDash.value),
              lineWidth: guideLineWidth.value,
            };
          });

          const canvasProps = computed(() => {
            return {
              class: 'canvasEl',
              style: 'width: 100%; height: 100%;',
            };
          });

          const onBegin = () => {
            lastEvent.value = 'begin';
          };

          const onEnd = () => {
            lastEvent.value = 'end';
          };

          const clear = () => {
            sigRef.value?.clear?.();
            exportedDataUrl.value = '';
            lastEvent.value = 'clear';
          };

          const toggle = () => {
            enabled.value = !enabled.value;
            if (enabled.value) {
              sigRef.value?.on?.();
              lastEvent.value = 'enabled';
              return;
            }
            sigRef.value?.off?.();
            lastEvent.value = 'disabled';
          };

          const exportPng = () => {
            exportedDataUrl.value =
              sigRef.value?.toDataURL?.('image/png') || '';
            lastEvent.value = 'export';
          };

          return {
            sigRef,
            penColor,
            minWidth,
            maxWidth,
            throttle,
            enabled,
            lastEvent,
            exportedDataUrl,
            gridEnabled,
            gridMode,
            gridSize,
            gridColor,
            gridDash,
            gridLineWidth,
            guideEnabled,
            guideText,
            guideFont,
            guideColor,
            guideOpacity,
            guideDash,
            guideLineWidth,
            options,
            grid,
            guide,
            canvasProps,
            onBegin,
            onEnd,
            clear,
            toggle,
            exportPng,
          };
        },
        template: `
          <div class="page">
            <header class="header">
              <div class="title">vue-signature-canvas static demo</div>
              <div class="actions">
                <button class="btn" type="button" @click="clear">Clear</button>
                <button class="btn" type="button" @click="toggle">
                  {{ enabled ? 'Disable' : 'Enable' }}
                </button>
                <button class="btn primary" type="button" @click="exportPng">Export PNG</button>
              </div>
            </header>

            <section class="content">
              <div class="canvasWrap">
                <vue-signature-canvas
                  ref="sigRef"
                  :options="options"
                  :canvas-props="canvasProps"
                  :clear-on-resize="true"
                  :grid="grid"
                  :guide="guide"
                  @begin="onBegin"
                  @end="onEnd"
                />
              </div>

              <div class="panel">
                <div class="row">
                  <label class="label">Pen color</label>
                  <input v-model="penColor" class="input" type="color" />
                </div>
                <div class="row">
                  <label class="label">Min width</label>
                  <input v-model.number="minWidth" class="input" type="number" step="0.1" min="0" />
                </div>
                <div class="row">
                  <label class="label">Max width</label>
                  <input v-model.number="maxWidth" class="input" type="number" step="0.1" min="0" />
                </div>
                <div class="row">
                  <label class="label">Throttle</label>
                  <input v-model.number="throttle" class="input" type="number" step="1" min="0" />
                </div>
                <div class="row">
                  <label class="label">Grid</label>
                  <input v-model="gridEnabled" class="check" type="checkbox" />
                </div>
                <div class="row">
                  <label class="label">Grid mode</label>
                  <select v-model="gridMode" class="input">
                    <option value="square">square</option>
                    <option value="zheng">zheng</option>
                  </select>
                </div>
                <div class="row">
                  <label class="label">Grid size</label>
                  <input v-model.number="gridSize" class="input" type="number" step="1" min="4" />
                </div>
                <div class="row">
                  <label class="label">Grid color</label>
                  <input v-model="gridColor" class="input" type="text" />
                </div>
                <div class="row">
                  <label class="label">Grid dash</label>
                  <input v-model="gridDash" class="input" type="text" />
                </div>
                <div class="row">
                  <label class="label">Grid width</label>
                  <input v-model.number="gridLineWidth" class="input" type="number" step="1" min="1" />
                </div>
                <div class="row">
                  <label class="label">Guide</label>
                  <input v-model="guideEnabled" class="check" type="checkbox" />
                </div>
                <div class="row">
                  <label class="label">Guide text</label>
                  <textarea v-model="guideText" class="textarea" style="height: 70px;"></textarea>
                </div>
                <div class="row">
                  <label class="label">Guide font</label>
                  <input v-model="guideFont" class="input" type="text" />
                </div>
                <div class="row">
                  <label class="label">Guide color</label>
                  <input v-model="guideColor" class="input" type="color" />
                </div>
                <div class="row">
                  <label class="label">Guide opacity</label>
                  <input v-model.number="guideOpacity" class="input" type="number" step="0.05" min="0" max="1" />
                </div>
                <div class="row">
                  <label class="label">Guide dash</label>
                  <input v-model="guideDash" class="input" type="text" />
                </div>
                <div class="row">
                  <label class="label">Guide width</label>
                  <input v-model.number="guideLineWidth" class="input" type="number" step="1" min="1" />
                </div>
                <div class="row">
                  <label class="label">Last event</label>
                  <div class="mono">{{ lastEvent }}</div>
                </div>
                <div class="row">
                  <label class="label">Export (strokes)</label>
                  <textarea class="textarea" readonly :value="exportedDataUrl"></textarea>
                </div>
                <div class="row">
                  <label class="label">Export note</label>
                  <div class="mono">Grid/guide are not included in toDataURL() exports.</div>
                </div>
              </div>
            </section>
          </div>
        `,
      })
        .use(VueSignatureCanvas)
        .mount('#app');
    </script>
  </body>
</html>
